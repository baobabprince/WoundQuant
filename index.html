<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoundQuant – Loading...</title>
<style>
body{font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f1f5f9}
.box{background:#fff;border:1px solid #cbd5e1;padding:24px 32px;border-radius:12px;text-align:center;max-width:420px}
.spinner{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
<div class="spinner"></div>
<p id="msg">טוען את WoundQuant...</p>
</div>
<script>
(async function() {
  const msg = document.getElementById("msg");
  try {
    const res = await fetch("app.gz.b64");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const b64 = (await res.text()).trim();
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    const ds = new DecompressionStream("gzip");
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    msg.textContent = "שגיאה בטעינה: " + e.message + ". נסה לרענן.";
    console.error(e);
  }
})();
</script>
</body>
</html>
