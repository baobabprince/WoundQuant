<!DOCTYPE html>
<html lang="he" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoundQuant</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui;background:#f1f5f9}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:99999;background:#f1f5f9}
.box{background:#fff;border:1px solid #cbd5e1;padding:24px;border-radius:12px;text-align:center}
.spinner{width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:s .6s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head><body>
<div id="boot"><div class="box"><div class="spinner"></div><p id="msg">טוען WoundQuant…</p></div></div>
<script src="c0.js?v=20"></script>
<script src="c1.js?v=20"></script>
<script src="c2.js?v=20"></script>
<script src="c3.js?v=20"></script>
<script src="c4.js?v=20"></script>
<script src="c5.js?v=20"></script>
<script src="c6.js?v=20"></script>
<script>
(async function(){
  var msg=document.getElementById("msg");
  try{
    if(!window.WQ) throw new Error("missing data");
    var bin=atob(window.WQ);
    var bytes=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    var stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
    var html=await new Response(stream).text();
    if(html.length<50000) throw new Error("bad app size");
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    msg.textContent="שגיאה: "+e.message;
    console.error(e);
  }
})();
</script>
</body></html>
