<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="UTF-8"><title>WoundQuant</title>
<style>body{font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f1f5f9}
.box{background:#fff;border:1px solid #cbd5e1;padding:24px;border-radius:12px;text-align:center;max-width:420px}
.spinner{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 12px}@keyframes s{to{transform:rotate(360deg)}}</style>
</head><body><div class="box"><div class="spinner"></div><p id="m">טוען WoundQuant...</p></div>
<script>
(async()=>{
  try{
    const t="?t="+Date.now();
    const [a,b]=await Promise.all([
      fetch("app_b64_1.txt"+t).then(r=>{if(!r.ok)throw new Error("p1 "+r.status);return r.text()}),
      fetch("app_b64_2.txt"+t).then(r=>{if(!r.ok)throw new Error("p2 "+r.status);return r.text()})
    ]);
    const bin=Uint8Array.from(atob(a+b),c=>c.charCodeAt(0));
    const ds=new DecompressionStream("gzip");
    const stream=new Response(bin).body.pipeThrough(ds);
    const html=await new Response(stream).text();
    document.open(); document.write(html); document.close();
  }catch(e){ document.getElementById("m").textContent="שגיאה: "+e.message; console.error(e); }
})();
</script></body></html>
