<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoundQuant</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui;background:#f1f5f9}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:99999;background:#f1f5f9}
.box{background:#fff;border:1px solid #cbd5e1;padding:24px;border-radius:12px;text-align:center;max-width:400px}
.spinner{width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:s .6s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="boot"><div class="box"><div class="spinner"></div><p id="msg">טוען WoundQuant…</p></div></div>
<script>
(async()=>{
  var msg=document.getElementById("msg");
  try{
    try{
      var keys=["wq_app_v13","wq_app_v14","wq_app_v15","wq_app_v19","wq_full_v15","wq_full_v16","wq_full_v17","wq_full_v18"];
      keys.forEach(function(k){sessionStorage.removeItem(k);});
    }catch(e){}

    var t="?v=25";
    var appRes=await fetch("https://cdn.jsdelivr.net/gh/baobabprince/WoundQuant@1c657ff/index.html"+t);
    if(!appRes.ok) throw new Error("app "+appRes.status);
    var boostRes=await fetch("boost.json"+t);
    if(!boostRes.ok) boostRes=await fetch("https://raw.githubusercontent.com/baobabprince/WoundQuant/master/boost.json"+t);
    if(!boostRes.ok) throw new Error("boost "+boostRes.status);
    var html=await appRes.text();
    var B=await boostRes.json();
    if(html.length<10000) throw new Error("too small");

    function rep(a,b){ if(a&&b&&html.indexOf(a)>=0) html=html.replace(a,b); }

    rep("const maxDim = 350;","const maxDim = 99999;");
    rep("Math.max(0.5, Math.min(3.0, zoom))","Math.max(0.25, Math.min(5.0, zoom))");
    rep("canvas.style.transformOrigin = 'center center';",
        "canvas.style.transformOrigin = 'center center';\n        canvas.style.imageRendering = currentZoomLevel > 1.01 ? 'pixelated' : 'auto';");

    rep(
      "let manualMasks = new Map(); // key: seriesKey_hours, value: Uint8Array\nlet savedPolygons = new Map(); // key: seriesKey_hours, value: Array of polygon points\nlet isAnnotationMode = false;\nlet currentDrawingTool = 'brush'; // 'brush', 'eraser', 'polygon'\nlet brushSize = 15;\nlet polygonPoints = []; // [{x, y}, ...]\nlet isDrawing = false;\nlet currentZoomLevel = 1.0;",
      "let manualMasks = new Map();\nlet savedPolygons = new Map();\nlet annotationSource = new Map();\nlet isAnnotationMode = false;\nlet currentDrawingTool = 'brush';\nlet brushSize = 15;\nlet polygonPoints = [];\nlet isDrawing = false;\nlet currentZoomLevel = 1.0;\nlet annotationUndoStack = [];\nconst ANNOTATION_STORAGE_KEY = 'woundquant_annotations_v1';\nconst MAX_UNDO = 30;"
    );

    rep(B.highconf_old, B.highconf_new);

    rep(
      "const scaleFactor = (res.width * res.height > 0) ? (res.imgData.width * res.imgData.height) / (res.width * res.height) : 1;\n            res.burnArea = Math.round(burnArea * scaleFactor);",
      "let wellPx=0; if(res.wellMask){for(let wi=0;wi<res.wellMask.length;wi++)if(res.wellMask[wi]>0)wellPx++;}\n            const scaleFactor=(wellPx>0&&res.wellArea)?(res.wellArea/wellPx):1;\n            res.burnArea=Math.round(burnArea*scaleFactor);\n            res.source='manual';"
    );
    rep(
      "const scaleFactor = (res.width * res.height > 0) ? (res.imgData.width * res.imgData.height) / (res.width * res.height) : 1;\n                    res.burnArea = Math.round(mBurnArea * scaleFactor);",
      "let wellPxB=0; if(res.wellMask){for(let wi=0;wi<res.wellMask.length;wi++)if(res.wellMask[wi]>0)wellPxB++;}\n                    const scaleFactor=(wellPxB>0&&res.wellArea)?(res.wellArea/wellPxB):1;\n                    res.burnArea=Math.round(mBurnArea*scaleFactor);\n                    res.source='manual';"
    );

    rep(
      "    for (let i = 0; i < mask.length; i++) {\n        const idx = i * 4;\n        if (data[idx] > 128) {\n            mask[i] = 255;\n        }\n    }\n\n    const key = getActiveImageKey();\n    if (key) {\n        if (!savedPolygons.has(key)) {\n            savedPolygons.set(key, []);\n        }\n        savedPolygons.get(key).push([...polygonPoints]);\n    }\n\n    polygonPoints = [];\n    renderPreview(true);",
      "    mask.fill(0);\n    for (let i = 0; i < mask.length; i++) {\n        const idx = i * 4;\n        if (data[idx] > 128) mask[i] = 255;\n    }\n    const key = getActiveImageKey();\n    if (key) {\n        if (!savedPolygons.has(key)) savedPolygons.set(key, []);\n        savedPolygons.get(key).push([...polygonPoints]);\n        annotationSource.set(key, 'manual');\n    }\n    polygonPoints = [];\n    if (lastResult) {\n      lastResult.finalMask.set(mask);\n      let ba=0; for(let i=0;i<mask.length;i++) if(mask[i]>0) ba++;\n      let wellPx=0; if(lastResult.wellMask) for(let wi=0;wi<lastResult.wellMask.length;wi++) if(lastResult.wellMask[wi]>0) wellPx++;\n      const sf=(wellPx>0&&lastResult.wellArea)?(lastResult.wellArea/wellPx):1;\n      lastResult.burnArea=Math.round(ba*sf);\n      lastResult.source='manual';\n    }\n    try{persistAnnotations();}catch(_){}\n    renderPreview(true);"
    );

    rep("function getActiveManualMask(res) {", B.storage+"function getActiveManualMask(res) {");

    rep(
      'onclick="applyPolygon()" style="background: var(--primary); color: white; border-color: var(--primary); padding: 4px 10px; font-size: 0.75rem;">✅ סגור ומלא פוליגון</button>',
      'onclick="applyPolygon()" style="background: var(--primary); color: white; border-color: var(--primary); padding: 4px 10px; font-size: 0.75rem;">✅ סגור ומלא פוליגון</button>\n<button class="step-btn" onclick="undoAnnotation()" style="padding: 4px 10px; font-size: 0.75rem;" title="Ctrl+Z">↩️ בטל</button>'
    );

    rep(
      'csvContent += "Series/Well,Filename,Timepoint (Hours),Confluency (%),Burn (%),Burn Area (px),Well Area (px),Normalized Burn Area to t=0\\n";',
      'csvContent += "Series/Well,Filename,Timepoint (Hours),Confluency (%),Burn (%),Burn Area (px),Well Area (px),Normalized Burn Area to t=0,Closure (%),Closure Rate (%/h),Source\\n";'
    );

    rep(
      "updateLanguage();\ntoggleTextureControls();\n<\/script>",
      "updateLanguage();\ntoggleTextureControls();\nloadAnnotationsFromStorage();\ndocument.addEventListener('keydown',(e)=>{\n  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT'))return;\n  const k=e.key.toLowerCase();\n  if(k==='b'&&isAnnotationMode)setDrawingTool('brush');\n  else if(k==='e'&&isAnnotationMode)setDrawingTool('eraser');\n  else if(k==='p'&&isAnnotationMode)setDrawingTool('polygon');\n  else if(k==='z'&&(e.ctrlKey||e.metaKey)){e.preventDefault();undoAnnotation();}\n  else if(k==='enter'&&isAnnotationMode&&currentDrawingTool==='polygon'&&polygonPoints.length>=3){e.preventDefault();applyPolygon();}\n});\n<\/script>"
    );

    rep(
      "    filesMap.clear();\n    let loadedCount = 0;\n\n    for (const fileName of exampleFilenames) {\n        try {\n            const encodedName = encodeURIComponent(fileName);\n            const response = await fetch(`./examples/${encodedName}`);\n            if (!response.ok) continue;\n            const blob = await response.blob();\n            const file = new File([blob], fileName, { type: blob.type || 'image/jpeg' });\n\n            const match = fileName.match(FILENAME_REGEX);\n            if (match) {\n                const { well, site, days, hours, mins } = match.groups;\n                const totalHours = parseInt(days)*24 + parseInt(hours) + parseInt(mins)/60;\n                const seriesKey = `${well}_Site${site}`;\n\n                if (!filesMap.has(seriesKey)) filesMap.set(seriesKey, []);\n                filesMap.get(seriesKey).push({ file, hours: totalHours, well, site });\n                loadedCount++;\n            }\n        } catch (e) {\n            console.warn(`Could not load ./examples/${fileName}`, e);\n        }\n    }",
      "    filesMap.clear();\n    const CDN='https://cdn.jsdelivr.net/gh/baobabprince/WoundQuant@1c657ff/examples/';\n    const results=await Promise.all(exampleFilenames.map(async(fileName)=>{\n      try{\n        const r=await fetch(CDN+encodeURIComponent(fileName));\n        if(!r.ok)return null;\n        const blob=await r.blob();\n        return new File([blob],fileName,{type:blob.type||'image/jpeg'});\n      }catch(e){return null;}\n    }));\n    let loadedCount=0;\n    for(const file of results){\n      if(!file)continue;\n      const match=file.name.match(FILENAME_REGEX);\n      if(!match)continue;\n      const {well,site,days,hours,mins}=match.groups;\n      const totalHours=parseInt(days)*24+parseInt(hours)+parseInt(mins)/60;\n      const seriesKey=`${well}_Site${site}`;\n      if(!filesMap.has(seriesKey))filesMap.set(seriesKey,[]);\n      filesMap.get(seriesKey).push({file,hours:totalHours,well,site});\n      loadedCount++;\n    }"
    );

    rep(
      "    files.forEach(file => {\n        const match = file.name.match(FILENAME_REGEX);\n        if (match) {\n            const { well, site, days, hours, mins } = match.groups;\n            const totalHours = parseInt(days)*24 + parseInt(hours) + parseInt(mins)/60;\n            const seriesKey = `${well}_Site${site}`;\n\n            if (!filesMap.has(seriesKey)) filesMap.set(seriesKey, []);\n            filesMap.get(seriesKey).push({ file, hours: totalHours, well, site });\n        }\n    });\n\n    statusBadge.innerText = dict.loadedManual(files.length);\n    populateSeriesDropdown();",
      "    let matched = 0, unmatched = 0;\n    files.forEach(function(file) {\n        const match = file.name.match(FILENAME_REGEX);\n        if (match) {\n            const g = match.groups;\n            const totalHours = parseInt(g.days)*24 + parseInt(g.hours) + parseInt(g.mins)/60;\n            const seriesKey = g.well + '_Site' + g.site;\n            if (!filesMap.has(seriesKey)) filesMap.set(seriesKey, []);\n            filesMap.get(seriesKey).push({ file: file, hours: totalHours, well: g.well, site: g.site });\n            matched++;\n        } else {\n            if (!filesMap.has('Upload')) filesMap.set('Upload', []);\n            filesMap.get('Upload').push({ file: file, hours: unmatched, well: 'X', site: '1' });\n            unmatched++;\n        }\n    });\n    statusBadge.innerText = (matched + unmatched > 0)\n      ? (dict.loadedManual(matched + unmatched) + (unmatched ? (' (' + unmatched + ' ללא תבנית שם)') : ''))\n      : (currentLang==='he' ? 'לא נטענו קבצים' : 'No files loaded');\n    populateSeriesDropdown();"
    );

    rep(
      "function populateSeriesDropdown() {\n    filesMap.forEach(arr => arr.sort((a,b) => a.hours - b.hours));\n    selectSeries.innerHTML = '';\n    filesMap.forEach((_, key) => {\n        const opt = document.createElement('option');\n        opt.value = key;\n        opt.innerText = key;\n        selectSeries.appendChild(opt);\n    });\n    if (filesMap.size > 0) updateTimeDropdown();\n}",
      "function populateSeriesDropdown() {\n    filesMap.forEach(function(arr){ arr.sort(function(a,b){ return a.hours - b.hours; }); });\n    selectSeries.innerHTML = '';\n    filesMap.forEach(function(_, key) {\n        var opt = document.createElement('option');\n        opt.value = key;\n        opt.innerText = key;\n        selectSeries.appendChild(opt);\n    });\n    if (filesMap.size > 0) { selectSeries.selectedIndex = 0; updateTimeDropdown(); }\n}"
    );

    rep(
      "        res = await processImageFile(item, cropMargin, textureFilter, textureRadius, threshMethod, invertThresh, postProcess, closingRad, useHull, prevMaskSmall);\n        res.seriesKey = seriesKey;\n        res.hours = timeVal;\n        lastResult = res;",
      "        try {\n          var sb = document.getElementById('statusBadge');\n          if (sb) sb.innerText = (typeof currentLang!=='undefined'&&currentLang==='he') ? 'מעבד תמונה…' : 'Processing…';\n          res = await processImageFile(item, cropMargin, textureFilter, textureRadius, threshMethod, invertThresh, postProcess, closingRad, useHull, prevMaskSmall);\n          if (res && res.error) { if (sb) sb.innerText = 'שגיאה בטעינת תמונה (TIFF/פורמט?)'; return; }\n          res.seriesKey = seriesKey;\n          res.hours = timeVal;\n          lastResult = res;\n          if (sb) sb.innerText = (typeof currentLang!=='undefined'&&currentLang==='he') ? 'מוכן' : 'Ready';\n        } catch (err) {\n          console.error(err);\n          var sb2 = document.getElementById('statusBadge');\n          if (sb2) sb2.innerText = 'שגיאה: ' + (err && err.message ? err.message : err);\n          return;\n        }"
    );

    rep(
      '<option value="entropy" selected>אנטרופיה מקומית (Local Entropy)</option>',
      '<option value="entropy">אנטרופיה מקומית (Local Entropy)</option>'
    );
    rep(
      '<option value="variance">שונות מקומית (Local Variance)</option>',
      '<option value="variance" selected>שונות מקומית (Local Variance)</option>'
    );
    rep(
      "if (textureFilter === 'entropy') {\n                processedGray = computeLocalEntropy(sharpenedGray, w, h, textureRadius);\n            } else if (textureFilter === 'variance') {\n                processedGray = computeLocalVariance(sharpenedGray, w, h, textureRadius);\n            }",
      "var tr = Math.min(textureRadius|0, textureFilter==='entropy' ? 3 : 6);\n            if (textureFilter === 'entropy') {\n                processedGray = computeLocalEntropy(sharpenedGray, w, h, tr);\n            } else if (textureFilter === 'variance') {\n                processedGray = computeLocalVariance(sharpenedGray, w, h, tr);\n            }"
    );
    rep(
      "ChanVeseJS(processedGray, wellMask, w, h, initMask, 40, 2, 1.0, 1.0);",
      "ChanVeseJS(processedGray, wellMask, w, h, initMask, 12, 2, 1.0, 1.0);"
    );
    rep(
      "let burnSeed = erode(closedBinary, w, h, 12);",
      "let burnSeed = erode(closedBinary, w, h, 5);"
    );
    rep(
      "const img = new Image();\n        img.onload = () => {",
      "const img = new Image();\n        img.onerror = () => { try{URL.revokeObjectURL(img.src);}catch(e){} resolve({error:true, burnArea:0, wellArea:1, finalMask:new Uint8Array(1), wellMask:new Uint8Array(1), width:1, height:1, imgData:null, fullImg:null}); };\n        img.onload = () => {"
    );
    rep(
      "const dilatedPrev = dilate(prevMaskSmall, w, h, 8);",
      "const dilatedPrev = dilate(prevMaskSmall, w, h, 4);"
    );

    rep(
      '<script src="https://cdn.jsdelivr.net/npm/chart.js"><\/script>',
      '<script src="https://cdn.jsdelivr.net/npm/chart.js"><\/script>\n    <script src="https://cdn.jsdelivr.net/npm/utif@3.1.0/UTIF.js"><\/script>'
    );
    rep(
      'accept="image/*"',
      'accept="image/*,.tif,.tiff,image/tiff,image/tif"'
    );
    rep(
      "        img.src = URL.createObjectURL(fileItem.file);\n    });\n}",
      "        (async function(){\n          try {\n            var f = fileItem.file;\n            var nm = (f.name || '').toLowerCase();\n            var isTiff = nm.endsWith('.tif') || nm.endsWith('.tiff') || (f.type && f.type.indexOf('tif') >= 0);\n            if (isTiff) {\n              if (typeof UTIF === 'undefined') throw new Error('TIFF decoder (UTIF) not loaded');\n              var buf = await f.arrayBuffer();\n              var ifds = UTIF.decode(buf);\n              if (!ifds || !ifds.length) throw new Error('empty TIFF');\n              UTIF.decodeImage(buf, ifds[0]);\n              var rgba = new Uint8ClampedArray(UTIF.toRGBA8(ifds[0]));\n              var tc = document.createElement('canvas');\n              tc.width = ifds[0].width; tc.height = ifds[0].height;\n              tc.getContext('2d').putImageData(new ImageData(rgba, tc.width, tc.height), 0, 0);\n              tc.toBlob(function(blob){\n                if (!blob) { resolve({error:true, burnArea:0, wellArea:1, finalMask:new Uint8Array(1), wellMask:new Uint8Array(1), width:1, height:1, imgData:null, fullImg:null}); return; }\n                img.src = URL.createObjectURL(blob);\n              }, 'image/png');\n            } else {\n              img.src = URL.createObjectURL(f);\n            }\n          } catch (err) {\n            console.error(err);\n            resolve({error:true, message: String(err && err.message || err), burnArea:0, wellArea:1, finalMask:new Uint8Array(1), wellMask:new Uint8Array(1), width:1, height:1, imgData:null, fullImg:null});\n          }\n        })();\n    });\n}"
    );

    // Fix full-well marking + download annotated image
    rep(
      'id="invertThreshCheckbox" checked onchange="renderPreview()"',
      'id="invertThreshCheckbox" onchange="renderPreview()"'
    );
    rep(
      '<option value="chan_vese" selected>סגמנטציית אקטיב קונטור במרחב-זמן (Chan-Vese)</option>\n                <option value="largest">הרכיב הקשיר הגדול ביותר בלבד</option>',
      '<option value="chan_vese">סגמנטציית אקטיב קונטור במרחב-זמן (Chan-Vese)</option>\n                <option value="largest" selected>הרכיב הקשיר הגדול ביותר בלבד</option>'
    );
    rep(
      "function exportResultsCSV() {",
      "function downloadAnnotatedImage(){\n  try{\n    if(!lastResult){alert(currentLang==='he'?'אין תמונה להורדה — העלה ועבד תמונה תחילה':'No image to download');return;}\n    var link=document.createElement('a');\n    var name=(document.getElementById('currentFilenameText')&&document.getElementById('currentFilenameText').innerText)||'woundquant';\n    name=name.replace(/\\.[^.]+$/,'')+'_annotated.png';\n    link.download=name;\n    link.href=mainCanvas.toDataURL('image/png');\n    link.click();\n  }catch(e){console.error(e);alert('Export error: '+e.message);}\n}\nfunction exportResultsCSV() {"
    );
    rep(
      '<button class="btn-secondary" id="btnExportCSV"',
      '<button class="btn-secondary" id="btnDownloadAnnotated" onclick="downloadAnnotatedImage()" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;">📸 <span id="textDownloadAnnotated">הורד תמונה עם סימון</span></button>\n            <button class="btn-secondary" id="btnExportCSV"'
    );

    var boot=document.getElementById('boot');
    if(boot) boot.remove();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    msg.textContent="שגיאה: "+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
