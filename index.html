    rep(
      '<option value="chan_vese" selected>סגמנטציית אקטיב קונטור במרחב-זמן (Chan-Vese)</option>\n                <option value="largest">הרכיב הקשיר הגדול ביותר בלבד</option>',

    );
    rep(
      'id="invertThreshCheckbox" checked onchange="renderPreview()"',

    rep(
      "            // Scale burnArea and wellArea back up to original image resolution",

    );
    rep('accept="image/*"','accept="image/*,.tif,.tiff,image/tiff,image/tif"');

      "        img.src = URL.createObjectURL(fileItem.file);\n    });\n}",
      "        (async function(){\n          try {\n            var f = fileItem.file;\n            var nm = (f.name || '').toLowerCase();\n            var isTiff = nm.endsWith('.tif') || nm.endsWith('.tiff') || (f.type && f.type.indexOf('tif') >= 0);\n            if (isTiff) {\n              if (typeof UTIF === 'undefined') throw new Error('TIFF decoder (UTIF) not loaded');\n              var buf = await f.arrayBuffer();\n              var ifds = UTIF.decode(buf);\n              if (!ifds || !ifds.length) throw new Error('empty TIFF');\n              UTIF.decodeImage(buf, ifds[0]);\n              var rgba = new Uint8ClampedArray(UTIF.toRGBA8(ifds[0]));\n              var tc = document.createElement('canvas');\n              tc.width = ifds[0].width; tc.height = ifds[0].height;\n              tc.getContext('2d').putImageData(new ImageData(rgba, tc.width, tc.height), 0, 0);\n              tc.toBlob(function(blob){\n                if (!blob) { resolve({error:true, burnArea:0, wellArea:1, finalMask:new Uint8Array(1), wellMask:new Uint8Array(1), width:1, height:1, imgData:null, fullImg:null}); return; }\n                img.src = URL.createObjectURL(blob);\n              }, 'image/png');\n            } else {\n              img.src = URL.createObjectURL(f);\n            }\n          } catch (err) {\n            console.error(err);\n            resolve({error:true, message: String(err && err.message || err), burnArea:0, wellArea:1, finalMask:new Uint8Array(1), wellMask:new Uint8Array(1), width:1, height:1, imgData:null, fullImg:null});\n          }\n        })();\n    });\n}"

    rep(
      "function getActiveImageKey() {\n    const seriesKey = selectSeries.value;\n    const timeVal = parseFloat(selectTime.value);\n    if (!seriesKey || isNaN(timeVal)) return null;\n    return `${seriesKey}_${timeVal}`;\n}",
      "function getActiveImageKey() {\n    try {\n      var sk = selectSeries.value;\n      var tv = parseFloat(selectTime.value);\n      var items = filesMap.get(sk);\n      if (items) {\n        var item = null;\n        for (var ii=0;ii<items.length;ii++) if (Math.abs(items[ii].hours - tv) < 1e-6) { item = items[ii]; break; }\n        if (item && item.file && item.file.name) return 'file:' + item.file.name;\n      }\n    } catch (e) {}\n    var seriesKey = selectSeries.value;\n    var timeVal = parseFloat(selectTime.value);\n    if (!seriesKey || isNaN(timeVal)) return null;\n    return seriesKey + '_' + timeVal;\n}"
    );
    rep(
      "function onDrawingEnd() {\n    isDrawing = false;\n}",
      "function onDrawingEnd() {\n    if (isDrawing && isAnnotationMode) {\n      try {\n        var key = getActiveImageKey();\n        if (key) annotationSource.set(key, 'manual');\n        persistAnnotations();\n      } catch (e) { console.warn(e); }\n    }\n    isDrawing = false;\n}"
    );
    rep(
      "function persistAnnotations(){try{const p={masks:{},polygons:{},sources:{},savedAt:Date.now()};for(const[k,mask]of manualMasks)p.masks[k]={data:maskToBase64(mask),length:mask.length};for(const[k,polys]of savedPolygons)p.polygons[k]=polys;for(const[k,s]of annotationSource)p.sources[k]=s;localStorage.setItem(ANNOTATION_STORAGE_KEY,JSON.stringify(p));}catch(e){console.warn(e);}}",
      "function persistAnnotations(){try{var p={masks:{},polygons:{},sources:{},savedAt:Date.now()};manualMasks.forEach(function(mask,k){p.masks[k]={data:maskToBase64(mask),length:mask.length};});savedPolygons.forEach(function(polys,k){p.polygons[k]=polys;});annotationSource.forEach(function(s,k){p.sources[k]=s;});var json=JSON.stringify(p);try{localStorage.setItem(ANNOTATION_STORAGE_KEY,json);}catch(e1){console.warn('localStorage full, using IDB',e1);}try{if(window.indexedDB){var req=indexedDB.open('woundquant_db',1);req.onupgradeneeded=function(){req.result.createObjectStore('kv');};req.onsuccess=function(){var tx=req.result.transaction('kv','readwrite');tx.objectStore('kv').put(json,'annotations');};}}catch(e2){console.warn(e2);}var n=manualMasks.size;var sb=document.getElementById('statusBadge');if(sb)sb.innerText=(typeof currentLang!=='undefined'&&currentLang==='he')?('נשמר סימון ('+n+' תמונות)'):('Annotation saved ('+n+')');}catch(e){console.warn(e);}}"
    );
    rep(
      "function loadAnnotationsFromStorage(){try{const raw=localStorage.getItem(ANNOTATION_STORAGE_KEY);if(!raw)return;const p=JSON.parse(raw);if(p.masks)for(const[k,o]of Object.entries(p.masks))if(o&&o.data&&o.length)manualMasks.set(k,base64ToMask(o.data,o.length));if(p.polygons)for(const[k,polys]of Object.entries(p.polygons))savedPolygons.set(k,polys);if(p.sources)for(const[k,s]of Object.entries(p.sources))annotationSource.set(k,s);}catch(e){console.warn(e);}}",
      "function loadAnnotationsFromStorage(){function apply(raw){try{if(!raw)return;var p=JSON.parse(raw);if(p.masks)Object.keys(p.masks).forEach(function(k){var o=p.masks[k];if(o&&o.data&&o.length)manualMasks.set(k,base64ToMask(o.data,o.length));});if(p.polygons)Object.keys(p.polygons).forEach(function(k){savedPolygons.set(k,p.polygons[k]);});if(p.sources)Object.keys(p.sources).forEach(function(k){annotationSource.set(k,p.sources[k]);});var n=manualMasks.size;if(n){var sb=document.getElementById('statusBadge');if(sb)sb.innerText=(typeof currentLang!=='undefined'&&currentLang==='he')?('שוחזרו '+n+' סימונים שמורים'):(n+' annotations restored');}}catch(e){console.warn(e);}}try{var raw=localStorage.getItem(ANNOTATION_STORAGE_KEY);if(raw)apply(raw);}catch(e){}try{if(window.indexedDB){var req=indexedDB.open('woundquant_db',1);req.onupgradeneeded=function(){req.result.createObjectStore('kv');};req.onsuccess=function(){try{var tx=req.result.transaction('kv','readonly');var g=tx.objectStore('kv').get('annotations');g.onsuccess=function(){if(g.result)apply(g.result);};}catch(e3){}};}}catch(e2){}}"
    );

    var boot=document.getElementById('boot');
    if(boot) boot.remove();
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    msg.textContent="שגיאה: "+e.message;
    console.error(e);
  }
})();
</script>
