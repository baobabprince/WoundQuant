<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoundQuant</title>
<style>
html,body{margin:0;height:100%;font-family:system-ui}
body{display:flex;align-items:center;justify-content:center;background:#f1f5f9}
.box{background:#fff;border:1px solid #cbd5e1;padding:24px;border-radius:12px;text-align:center}
.spinner{width:28px;height:28px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:s .6s linear infinite;margin:0 auto 10px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box" id="boot"><div class="spinner"></div><p id="msg">טוען WoundQuant…</p></div>
<script>
(async()=>{
  const msg=document.getElementById("msg");
  const KEY="wq_full_v16";
  try{
    try{["wq_app_v13","wq_app_v14","wq_app_v15","wq_full_v15"].forEach(k=>sessionStorage.removeItem(k));}catch(e){}
    let html=sessionStorage.getItem(KEY);
    if(!html||html.length<50000){
      const urls=["app.0.b64","app.1.b64","app.2.b64","app.3.b64","app.4.b64"].map(u=>u+"?v=16");
      const rs=await Promise.all(urls.map(u=>fetch(u)));
      if(rs.some(r=>!r.ok)) throw new Error("fetch fail");
      const b64=(await Promise.all(rs.map(r=>r.text()))).join("");
      const bin=atob(b64);
      const bytes=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      const ds=new DecompressionStream("gzip");
      const stream=new Blob([bytes]).stream().pipeThrough(ds);
      html=await new Response(stream).text();
      if(html.length<50000) throw new Error("bad app");
      try{sessionStorage.setItem(KEY,html);}catch(e){}
    }
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    msg.textContent="שגיאה: "+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
