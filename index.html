<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WoundQuant</title>
<style>
body{font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#f1f5f9}
.box{background:#fff;border:1px solid #cbd5e1;padding:24px;border-radius:12px;text-align:center;max-width:420px}
.spinner{width:32px;height:32px;border:3px solid #e2e8f0;border-top-color:#2563eb;border-radius:50%;animation:s .7s linear infinite;margin:0 auto 12px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="spinner"></div><p id="m">טוען...</p></div>
<script>
(async()=>{
  const m=document.getElementById("m");
  try{
    const t="?v=4";
    const parts=await Promise.all([0,1,2,3].map(i=>
      fetch("wq_c"+i+".b64"+t).then(r=>{if(!r.ok)throw new Error("c"+i+" "+r.status);return r.text()})
    ));
    m.textContent="מפענח...";
    const bin=Uint8Array.from(atob(parts.join("").replace(/\s/g,"")),c=>c.charCodeAt(0));
    const html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    if(html.length<10000) throw new Error("too small");
    document.open(); document.write(html); document.close();
  }catch(e){
    m.textContent="שגיאה: "+e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
