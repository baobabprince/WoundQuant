<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WoundQuant</title>
<meta name="description" content="Quantify burn / scratch wound closure in whole-well microscopy time series — in the browser, images never leave your computer.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230f766e'/%3E%3Cpath d='M16 8c4 2 7 4 6 9s-5 7-8 6-6-4-5-8 3-6 7-7z' fill='%23fecaca'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="#0f766e"/><path d="M16 8c4 2 7 4 6 9s-5 7-8 6-6-4-5-8 3-6 7-7z" fill="#fecaca"/></svg>
    <div>
      <h1>WoundQuant</h1>
      <p data-i18n="tagline"></p>
    </div>
  </div>
  <div class="topbar-actions">
    <span class="privacy-chip" data-i18n="privacyChip"></span>
    <button type="button" class="btn ghost" id="btnLang" aria-label="Language"></button>
  </div>
</header>

<div id="unsupported" class="banner error" hidden data-i18n="unsupported"></div>
<div id="bootError" class="banner error" hidden></div>
<noscript><div class="banner error">WoundQuant needs JavaScript. · האתר דורש JavaScript.</div></noscript>

<main>
  <!-- 1 · Load ------------------------------------------------------------>
  <section class="card" id="cardLoad">
    <h2><span class="step">1</span><span data-i18n="loadTitle"></span></h2>
    <div class="dropzone" id="dropzone" tabindex="0" role="button" aria-describedby="dropHint">
      <strong data-i18n="dropMain"></strong>
      <span id="dropHint" data-i18n="dropHint"></span>
      <div class="row center">
        <button type="button" class="btn" id="btnPickFolder" data-i18n="pickFolder"></button>
        <button type="button" class="btn" id="btnPickFiles" data-i18n="pickFiles"></button>
        <button type="button" class="btn ghost" id="btnExamples" data-i18n="loadExamples"></button>
      </div>
    </div>
    <input type="file" id="inputFiles" multiple accept="image/*,.tif,.tiff" hidden>
    <input type="file" id="inputFolder" webkitdirectory multiple hidden>
    <div class="row between" id="loadSummaryRow" hidden>
      <p id="loadSummary" class="summary" aria-live="polite"></p>
      <button type="button" class="btn ghost small" id="btnClear" data-i18n="clearFiles"></button>
    </div>
    <p id="loadNote" class="note" hidden></p>
  </section>

  <!-- 2 · Analyse --------------------------------------------------------->
  <section class="card" id="cardRun">
    <h2><span class="step">2</span><span data-i18n="runTitle"></span></h2>
    <div class="form-grid">
      <label class="field">
        <span data-i18n="engineLabel"></span>
        <select id="selEngine"></select>
        <small id="engineHelp"></small>
      </label>
      <label class="field">
        <span data-i18n="pixelSizeLabel"></span>
        <input type="number" id="inPixelSize" min="0" step="0.001" inputmode="decimal" placeholder="2.825">
        <small data-i18n="pixelSizeHelp"></small>
      </label>
      <label class="field" id="customModelField" hidden>
        <span data-i18n="customModelLabel"></span>
        <input type="file" id="inModel" accept=".onnx">
        <small id="customModelHelp" data-i18n="customModelHelp"></small>
      </label>
    </div>

    <details id="advanced">
      <summary data-i18n="advancedTitle"></summary>
      <div class="form-grid">
        <label class="field">
          <span><span data-i18n="pSensitivity"></span> <output id="outSensitivity"></output></span>
          <input type="range" id="pSensitivity" min="-1.5" max="1.5" step="0.1">
          <small data-i18n="pSensitivityHelp"></small>
        </label>
        <label class="field">
          <span><span data-i18n="pMargin"></span> <output id="outMargin"></output></span>
          <input type="range" id="pMargin" min="0" max="0.15" step="0.005">
          <small data-i18n="pMarginHelp"></small>
        </label>
        <label class="field">
          <span><span data-i18n="pIslands"></span> <output id="outIslands"></output></span>
          <input type="range" id="pIslands" min="0" max="0.3" step="0.005">
          <small data-i18n="pIslandsHelp"></small>
        </label>
        <label class="field">
          <span><span data-i18n="pMinRegion"></span> <output id="outMinRegion"></output></span>
          <input type="range" id="pMinRegion" min="0" max="0.03" step="0.001">
          <small data-i18n="pMinRegionHelp"></small>
        </label>
        <label class="field">
          <span data-i18n="pWoundMode"></span>
          <select id="pWoundMode">
            <option value="largest" data-i18n="pWoundModeLargest"></option>
            <option value="all" data-i18n="pWoundModeAll"></option>
          </select>
          <small data-i18n="pWoundModeHelp"></small>
        </label>
        <div class="field">
          <span>&nbsp;</span>
          <button type="button" class="btn ghost small" id="btnResetParams" data-i18n="resetParams"></button>
        </div>
      </div>
    </details>

    <div class="row">
      <button type="button" class="btn primary" id="btnRun" disabled data-i18n="run"></button>
      <button type="button" class="btn" id="btnPause" hidden data-i18n="pause"></button>
      <button type="button" class="btn" id="btnCancel" hidden data-i18n="cancel"></button>
      <span id="runHint" class="note inline"></span>
    </div>
    <div id="progressWrap" hidden>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progressBar"><div id="progressFill"></div></div>
      <p id="progressText" class="summary" aria-live="polite"></p>
    </div>
    <details id="errorBox" class="banner error" hidden>
      <summary id="errorSummary"></summary>
      <ul id="errorList"></ul>
    </details>
  </section>

  <!-- 3 · Review ---------------------------------------------------------->
  <section class="card" id="cardReview" hidden>
    <div class="row between wrap">
      <h2><span class="step">3</span><span data-i18n="reviewTitle"></span></h2>
      <div class="row wrap">
        <button type="button" class="btn" id="btnCsv" data-i18n="exportCsv"></button>
        <button type="button" class="btn" id="btnSummaryCsv" data-i18n="exportSummary"></button>
        <button type="button" class="btn" id="btnTraining" data-i18n="exportTraining"></button>
      </div>
    </div>

    <div class="workspace">
      <aside class="series-pane">
        <input type="search" id="seriesFilter" data-i18n-placeholder="filterPlaceholder">
        <label class="check"><input type="checkbox" id="flaggedOnly"> <span data-i18n="flaggedOnly"></span></label>
        <div class="series-head"><span data-i18n="colSeries"></span><span data-i18n="colClosure"></span></div>
        <ul id="seriesList" class="series-list" role="listbox" tabindex="0" aria-label="Series"></ul>
        <p id="seriesCount" class="note"></p>
      </aside>

      <div class="viewer-pane">
        <div class="toolbar" role="toolbar">
          <div class="tool-group" id="toolGroup">
            <button type="button" class="tool active" data-tool="pan" data-i18n-title="toolPan"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button>
            <button type="button" class="tool" data-tool="brush" data-i18n-title="toolBrush"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20c2.5 0 4-1.5 4-4l9.5-9.5a2.1 2.1 0 0 1 3 3L11 19c-2 1-4.5 1-7 1z"/><path d="M14 7l3 3"/></svg></button>
            <button type="button" class="tool" data-tool="eraser" data-i18n-title="toolEraser"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 20H9l-5-5a2 2 0 0 1 0-2.8l8.2-8.2a2 2 0 0 1 2.8 0l5 5a2 2 0 0 1 0 2.8L11 20"/><path d="M8 9l7 7"/></svg></button>
            <button type="button" class="tool" data-tool="polygon" data-i18n-title="toolPolygon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 8l7-4 7 5-2 9-9 1z"/><circle cx="5" cy="8" r="1.6" fill="currentColor"/><circle cx="12" cy="4" r="1.6" fill="currentColor"/><circle cx="19" cy="9" r="1.6" fill="currentColor"/><circle cx="17" cy="18" r="1.6" fill="currentColor"/><circle cx="8" cy="19" r="1.6" fill="currentColor"/></svg></button>
          </div>
          <label class="brush-size" data-i18n-title="brushSize">
            <input type="range" id="brushSize" min="4" max="200" step="2" value="40">
          </label>
          <button type="button" class="tool" id="btnUndo" data-i18n-title="undo" disabled><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
          <button type="button" class="tool" id="btnResetMask" data-i18n-title="resetMask" disabled><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
          <span class="spacer"></span>
          <label class="check"><input type="checkbox" id="chkOverlay" checked> <span data-i18n="showOverlay"></span></label>
          <button type="button" class="tool" id="btnZoomOut" data-i18n-title="zoomOut">−</button>
          <button type="button" class="tool" id="btnZoomFit" data-i18n-title="zoomFit"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <button type="button" class="tool" id="btnZoomIn" data-i18n-title="zoomIn">+</button>
          <button type="button" class="tool" id="btnSavePng" data-i18n-title="savePng"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg></button>
        </div>
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="viewCanvas" tabindex="0"></canvas>
          <div id="viewerMessage" class="viewer-message" hidden></div>
        </div>
        <p id="polygonHint" class="note" hidden data-i18n="polygonHint"></p>
        <div class="timeline">
          <button type="button" class="tool" id="btnPrev" data-i18n-title="prevTime">‹</button>
          <input type="range" id="timeSlider" min="0" max="0" step="1" value="0" aria-label="Time point">
          <button type="button" class="tool" id="btnNext" data-i18n-title="nextTime">›</button>
          <span id="timeLabel" class="time-label"></span>
        </div>
        <p id="fileLabel" class="file-label"></p>
        <div class="legend">
          <span><i class="sw wound"></i><span data-i18n="legendWound"></span></span>
          <span><i class="sw free"></i><span data-i18n="legendFree"></span></span>
          <span><i class="sw outside"></i><span data-i18n="legendOutside"></span></span>
        </div>
      </div>

      <div class="info-pane">
        <div class="metrics" id="metrics">
          <div class="metric"><span data-i18n="mWoundArea"></span><b id="mWoundArea">–</b></div>
          <div class="metric"><span data-i18n="mWoundPct"></span><b id="mWoundPct">–</b></div>
          <div class="metric"><span data-i18n="mClosure"></span><b id="mClosure">–</b></div>
          <div class="metric"><span data-i18n="mConfluence"></span><b id="mConfluence">–</b></div>
          <div class="metric"><span data-i18n="mT0Closure"></span><b id="mT0Closure">–</b></div>
          <div class="metric"><span data-i18n="mRate"></span><b id="mRate">–</b></div>
        </div>
        <p id="sourceLine" class="note"></p>
        <ul id="qcList" class="qc-list"></ul>
        <p id="seriesSummary" class="summary"></p>
        <p id="seriesWarning" class="note warn" hidden></p>
        <div class="chart-head">
          <h3 data-i18n="chartClosure"></h3>
          <label class="check"><input type="checkbox" id="chkAllSeries"> <span data-i18n="showAllSeries"></span></label>
        </div>
        <div class="chart-box"><canvas id="chartClosure"></canvas></div>
        <h3 data-i18n="chartArea"></h3>
        <div class="chart-box"><canvas id="chartArea"></canvas></div>
      </div>
    </div>
  </section>
</main>

<dialog id="dlgTraining">
  <form method="dialog">
    <h3 data-i18n="trainingTitle"></h3>
    <p data-i18n="trainingIntro"></p>
    <label class="check"><input type="radio" name="trainWhich" value="manual" checked> <span id="trainManualLabel"></span></label>
    <label class="check"><input type="radio" name="trainWhich" value="all"> <span id="trainAllLabel"></span></label>
    <p class="note" data-i18n="trainingNote"></p>
    <div class="row end">
      <button class="btn" value="cancel" data-i18n="cancel"></button>
      <button class="btn primary" value="ok" id="btnTrainingOk" data-i18n="export"></button>
    </div>
  </form>
</dialog>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<footer>
  <p>
    <span id="analyticsNotice"></span>
    <button type="button" class="link" id="btnOptOut" hidden></button>
  </p>
  <p>
    WoundQuant <span id="appVersion"></span> ·
    <a href="https://github.com/baobabprince/WoundQuant" target="_blank" rel="noopener">GitHub</a> ·
    <span data-i18n="shortcutsHint"></span>
  </p>
</footer>

<script src="config.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<script type="module" src="js/main.js"></script>
<script>
// Plain script on purpose: it still runs where the module above cannot
// (page opened as a file, or a very old browser) and says what to do.
(function () {
  var box = document.getElementById('bootError');
  function show(html) { box.innerHTML = html; box.hidden = false; }
  if (location.protocol === 'file:') {
    show('<b>האתר לא יכול לרוץ מקובץ מקומי.</b> יש להריץ שרת מקומי בתיקיית הפרויקט – <code dir="ltr">npm start</code> או <code dir="ltr">python -m http.server</code> – ולפתוח את הכתובת שמודפסת.' +
      '<br><span dir="ltr"><b>This page cannot run from a local file.</b> Start a local server in the project folder — <code>npm start</code> or <code>python -m http.server</code> — and open the address it prints.</span>');
    return;
  }
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!window.__wq) show('<b>הטעינה נכשלה.</b> נסו לרענן; אם זה חוזר, הדפדפן כנראה ישן מדי (נדרש Chrome / Edge / Firefox / Safari עדכני).' +
        '<br><span dir="ltr"><b>The app failed to start.</b> Try reloading; if it happens again the browser is probably too old (a current Chrome, Edge, Firefox or Safari is needed).</span>');
    }, 4000);
  });
})();
</script>
</body>
</html>
